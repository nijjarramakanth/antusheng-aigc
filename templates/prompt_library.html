<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>提示词库</title>
<style>
body{margin:0;background:#0b0f1a;color:#fff;font-family:Arial;}
.header{text-align:center;padding:20px;font-size:24px;}
.grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
.card{width:260px;background:#141a2a;padding:12px;border-radius:10px;}
.title{color:#00e5ff;}
</style>
</head>
<body>

<div class="header">提示词库</div>
<div class="grid" id="grid"></div>

<script>
async function load(){
  const res = await fetch('/api/prompts');
  const data = await res.json();

  const grid = document.getElementById('grid');
  data.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="title">${p.title}</div>
      <div>${p.content}</div>
    `;
    grid.appendChild(div);
  });
}

load();
</script>

</body>
</html>
